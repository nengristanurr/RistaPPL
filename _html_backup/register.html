<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Baru - PawMate</title>
  <meta name="description" content="Buat akun PawMate untuk mulai mengadopsi anjing dan kucing serta bergabung dengan komunitas pecinta hewan.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .auth-page-wrap {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at top right, #FFE8F0 0%, #FFF9FB 60%);
    }

    .auth-card {
      background: #fff;
      border-radius: var(--radius-xl);
      padding: 2.8rem 2.5rem;
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-light);
    }
  </style>
</head>
<body>

  <!-- Site Header / Navbar -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon-wrap">
          <i class="fa-solid fa-paw"></i>
        </div>
        <span>PawMate</span>
      </a>

      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
      </div>
    </div>
  </header>

  <div class="auth-page-wrap">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="logo-icon-wrap" style="margin: 0 auto 1rem; width: 50px; height: 50px; font-size: 1.5rem;">
          <i class="fa-solid fa-heart"></i>
        </div>
        <h1 style="font-size: 1.85rem; margin-bottom: 0.35rem;">Bergabung di PawMate</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Lengkapi data diri untuk memulai langkah adopsi sahabat barumu.</p>
      </div>

      <!-- Error Alert Box -->
      <div id="reg-error-msg" style="display:none; background:#FEE2E2; color:#DC2626; border:1px solid #FECACA; padding:0.8rem 1rem; border-radius:var(--radius-md); font-size:0.88rem; margin-bottom:1.25rem;">
      </div>

      <form onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="reg-name">Nama Lengkap <span class="required">*</span></label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="reg-name" class="form-control" placeholder="Nama lengkap Anda" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Alamat Email <span class="required">*</span></label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="reg-email" class="form-control" placeholder="nama@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Nomor WhatsApp <span class="required">*</span></label>
          <div class="input-with-icon">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" id="reg-phone" class="form-control" placeholder="Contoh: 081234567890" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Kata Sandi <span class="required">*</span></label>
          <div class="input-password-group input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="Minimal 5 karakter" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-password', this)" title="Lihat kata sandi">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Konfirmasi Kata Sandi <span class="required">*</span></label>
          <div class="input-password-group input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Ulangi kata sandi" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-confirm-password', this)" title="Lihat kata sandi">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="checkbox-label" style="font-size:0.85rem;">
            <input type="checkbox" required checked> Saya menyetujui syarat & ketentuan adopsi PawMate
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; height:48px; font-size:1rem; margin-top:0.5rem;">
          <i class="fa-solid fa-paw"></i> Buat Akun Sekarang
        </button>
      </form>

      <div style="text-align:center; margin-top:1.75rem; font-size:0.92rem; color:var(--text-muted);">
        Sudah memiliki akun? <a href="login.html" style="color:var(--primary); font-weight:700;">Masuk di sini</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/db.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
